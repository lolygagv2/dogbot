# WIM-Z treatbot.service glibc malloc tuning (2026-10-24).
#
# The robot process runs ~54 threads on 4 cores (aiortc, detector, audio,
# recorder, bus callbacks). glibc gives each contending thread its own
# 64 MB malloc arena (default limit 8 x cores = 32 arenas) and never returns
# fragmented arena pages, so RSS creeps for hours under mode cycling even with
# no Python-level leak (tb4 2026-10-24: +6 MB/min across coach sessions while
# thread/fd counts stayed flat). Two arenas + an aggressive trim threshold
# keep the heap compact; numpy/torch large blocks are mmapped and unaffected.
[Service]
Environment=MALLOC_ARENA_MAX=2
Environment=MALLOC_TRIM_THRESHOLD_=131072
