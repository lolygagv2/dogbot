# Cap NetworkManager-wait-online at 20s (default is 60s).
#
# treatbot.service orders on network-online.target so the cloud relay does not
# start dialling before DNS works. That ordering is only safe if the wait is
# bounded: a WIM-Z unit must still boot promptly with no WiFi at all (AP mode,
# out of range, dead dongle), and a 60s stall there delays every hardware
# service behind it.
#
# 20s is well clear of a healthy associate+DHCP (measured ~6s on tb2) while
# keeping the worst case short. Exceeding the timeout is not an error —
# nm-online exits non-zero, network-online.target activates anyway, and
# treatbot starts and falls back to its existing relay reconnect backoff.
[Service]
Environment=NM_ONLINE_TIMEOUT=20
