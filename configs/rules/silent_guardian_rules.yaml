# Silent Guardian Mode Configuration
# WIM-Z's PRIMARY product mode - bark-focused passive monitoring with positive reinforcement

mode_config:
  name: "Silent Guardian"
  description: "Passive bark monitoring with escalating intervention and treat rewards"
  session_duration_hours: 8
  max_treats_per_session: 11

# Dog identification via ArUco markers
dog_identification:
  elsa:
    aruco_id: 315
    audio_name: "elsa.mp3"
    audio_quiet: "quiet.mp3"  # Generic quiet for now
    audio_come: "dogs_come.mp3"
  bezik:
    aruco_id: 832
    audio_name: "bezik.mp3"
    audio_quiet: "quiet.mp3"
    audio_come: "dogs_come.mp3"

# Bark detection thresholds
# TUNED 2026-04-15: Lowered thresholds - dogs weren't triggering enough, too strict
bark_detection:
  threshold: 2                    # Barks to trigger intervention (lowered from 3)
  window_seconds: 60              # Time window for counting barks
  confidence_minimum: 0.35        # Lowered from 0.45 for more sensitivity
  loudness_threshold_db: -28      # Much more sensitive (was -21, dogs had to be VERY loud)
  # Fast-escalation: when sustained barks/minute exceeds this, skip straight to L4
  # (calming music) instead of climbing one level per intervention. 0 = disabled.
  # App "punishment level" slider maps to this (Max-aggressive=10, Min-aggressive=90,
  # default 30). Existing climb-the-levels logic still runs underneath.
  fast_escalation_bpm: 0
  # device: unset — auto-detect via audio.bark_buffer_arecord.find_usb_audio_device().
  # Probes PipeWire 'default' first; if silent, falls back to plughw:{usb_card},0
  # using the live arecord -l card number (USB enumerates dynamically across boots).

# Intervention sequences by escalation level
intervention_sequences:
  # Level 1: First bark event in the hour
  level_1:
    name: "Initial Quiet Request"
    commands:
      - type: audio
        file: "$dog_quiet"        # "[Dog name], quiet" or just "quiet.mp3"
        wait_after: 1.0
    quiet_required_seconds: 20
    reward_on_success: true

  # Level 2: Second bark event within 1 hour
  level_2:
    name: "Firm Quiet Request"
    commands:
      - type: audio
        file: "quiet.mp3"
        wait_after: 0.5
      - type: audio
        file: "quiet.mp3"
        wait_after: 0.5
      - type: audio
        file: "no.mp3"
        wait_after: 1.0
      - type: audio
        file: "dogs_come.mp3"
        wait_after: 2.0
      - type: audio
        file: "quiet.mp3"
        wait_after: 1.0
    quiet_required_seconds: 30
    reward_on_success: true

  # Level 3: Fourth bark event within 1 hour — physical attention sequence
  # Runs BEFORE the calming-music level. Quick in-place fwd/back/left/right
  # movements to break the dog's focus. See _run_movement_sequence().
  level_3:
    name: "Physical Attention Sequence"
    commands:
      - type: audio
        file: "quiet.mp3"
        wait_after: 1.0
    movement_cycles: 3            # fwd/back/left/right counts as one cycle
    move_duration_seconds: 0.4    # each move ~300-500ms (quick)
    move_speed_pct: 50            # drive PWM % (safe band 40-70; bus clamps 70)
    cycle_pause_seconds: 5.0      # pause between cycles (not after the last)
    quiet_required_seconds: 30
    reward_on_success: true

  # Level 4+: Fifth or more bark events within 1 hour
  level_4:
    name: "Calming Music Mode"
    commands:
      - type: audio
        file: "quiet.mp3"
        wait_after: 1.0
    play_calming_music: true
    calming_music_file: "songs/default/mozart_piano.mp3"
    quiet_periods_required: 2
    quiet_period_duration: 20     # Each quiet period must be 20 seconds
    reduce_treats: true           # Fewer treats at this escalation level
    reward_on_success: true

# Reward sequence (when dog successfully achieves quiet)
reward_sequence:
  enabled: true
  commands:
    - type: audio
      file: "dogs_come.mp3"
      wait_after: 2.0
    - type: audio
      file: "treat.mp3"           # "Do you want a treat?"
      wait_after: 10.0
    - type: camera_scan           # Scan to find dog via ArUco
      duration: 5.0
    - type: audio
      file: "sit.mp3"
      wait_after: 1.5
    - type: audio
      file: "quiet.mp3"
      wait_after: 3.0

  # Conditions for treat dispensing
  treat_conditions:
    quiet_only_seconds: 10        # 10 seconds of quiet = treat
    sit_and_quiet_seconds: 5      # OR 5 seconds of sit + quiet = treat

# Escalation tracking
escalation:
  window_minutes: 60              # Events within this window increase level
  reset_after_quiet_minutes: 15   # 15 min continuous quiet → reset to level 0 with ceremony
  max_level: 4                    # Cap at level 4 (1=verbal, 2=firm, 3=movement, 4=music)

# Session limits
session_limits:
  max_treats: 11                  # Maximum treats per 8-hour session
  max_interventions_per_hour: 6  # Safety limit
  min_time_between_treats: 120     # Minimum seconds between treats

# Unprompted (spontaneous) quiet reward.
# The intervention -> quiet -> reward path only fires for a dog that WAS
# barking, because an intervention starts on the bark threshold. Calm the dog
# reaches on its own is invisible to it, and during a panic episode + the
# post-panic cooldown interventions are suppressed entirely — so the calm a
# calming routine earns was never marked. This closes that gap.
# "Generous" variant: marks the calm the moment it appears, including
# mid-episode (during_panic: true). Set during_panic: false to only start
# counting once panic has exited.
unprompted_quiet:
  enabled: true
  quiet_minutes: 10        # continuous quiet (no passed barks) before marking
  repeat_minutes: 20       # minimum gap between two unprompted rewards
  max_per_session: 4       # session cap on unprompted rewards
  during_panic: true       # generous: mark calm even mid-episode

# Logging configuration
logging:
  log_barks: true
  log_interventions: true
  log_escalations: true
  log_treats: true
  log_quiet_periods: true

  # Analytics fields to track
  analytics:
    - bark_frequency
    - intervention_count
    - success_duration
    - escalation_levels
    - treats_dispensed
    - quiet_periods_achieved

# Audio file paths (relative to /home/morgan/dogbot/VOICEMP3/)
audio_paths:
  base: "/home/morgan/dogbot/VOICEMP3"
  talks: "/home/morgan/dogbot/VOICEMP3/talks"
  songs: "/home/morgan/dogbot/VOICEMP3/songs"

  # Specific files
  quiet: "talks/quiet.mp3"
  no: "talks/no.mp3"
  come: "talks/dogs_come.mp3"
  sit: "talks/sit.mp3"
  treat: "talks/treat.mp3"
  good_dog: "talks/good_dog.mp3"
  elsa: "talks/elsa.mp3"
  bezik: "talks/bezik.mp3"
  calming_music: "songs/default/mozart_piano.mp3"

  # Calming playlist: curated classical tracks (no EDM/rock/trance).
  # SG Level 4 + panic routine pick RANDOMLY from this list and chain to the
  # next random track when one finishes (continuous music, no repeats back-to-back).
  # "Symphony & Movie Themes - Classical Italian Opera Song.mp3" excluded as a
  # duplicate of ClassicItalianOpera.mp3.
  calming_music_playlist:
    - "songs/default/Bach Easter Oratorio, BWV 249_ Sinfonia.mp3"
    - "songs/default/Bach Minuet in D minor, BWV Anh. 132.mp3"
    - "songs/default/Bach Overture No.1_ Passepied.mp3"
    - "songs/default/Bach Overture No.2_ Badinerie.mp3"
    - "songs/default/Bach Overture No.3_ Air.mp3"
    - "songs/default/Bach Overture No.4_ Rejouissance.mp3"
    - "songs/default/Bach Toccata and Fugue in D minor, BWV 565.mp3"
    - "songs/default/classical - 1812 overture.mp3"
    - "songs/default/classical - holst-the_planets-mars.mp3"
    - "songs/default/classical - rhapsody in blue.mp3"
    - "songs/default/Classical - Vivaldi - Four Seasons - 1.mp3"
    - "songs/default/ClassicItalianOpera.mp3"
    - "songs/default/mozart_concerto.mp3"
    - "songs/default/mozart_piano.mp3"
    - "songs/default/MozartSymphony No 40, 1st movement.mp3"
    - "songs/default/Pachelbel - Canon In D.mp3"
    - "songs/default/Yepes Rodrigo  Concierto De Aranjuez M2.mp3"

# Bark type classification (surfacing the TFLite emotion classifier output).
# Model label set (ai/models/emotion_mapping.json — do NOT invent classes):
#   aggressive, alert, anxious, attention, playful, scared  (+ notbark veto)
bark_classification:
  # Below this classifier confidence a bark is logged as "unclassified"
  confidence_threshold: 0.40
  # Label -> reporting group. THE single place labels are grouped.
  groups:
    anxious: distress
    scared: distress
    attention: demand
    alert: alarm
    aggressive: aggressive
    playful: play
  # Owner-facing phrasing per group. THE single place strings live —
  # notifications/summaries pull from here, never hardcode.
  owner_phrases:
    distress: "distress vocalization"
    demand: "demand barking"
    alarm: "alarm barking"
    aggressive: "aggressive barking"
    play: "playful barking"
    unclassified: "barking"
  # Trend phrasing (bark rate last trend_window vs session average)
  trend_phrases:
    improving: "tapering off"
    worsening: "getting more frequent"
    flat: "holding steady"
  # If this many aggressive-class barks occur in a session, tag the session
  # summary/stop event with an 'aggressive' flag ("Your dog was aggressive today").
  aggressive_session_tag_min: 5

# Level-4 session summary + on-demand status pull
summary:
  enabled: true
  # Bark-rate trend compares the last N minutes against the session average
  trend_window_minutes: 30
  # Trend is 'improving'/'worsening' when recent rate differs from session
  # average by more than this fraction; otherwise 'flat'
  trend_tolerance: 0.25

# Panic detection — do-not-intervene branch.
# ANY signal triggers PANIC; interventions are suppressed for the episode.
panic:
  enabled: true
  # Signal 1a: burst — Morgan's rule: lots of barks + bad emotion together.
  # >= burst_barks within burst_window_seconds where at least burst_bad_emotion_min
  # of them are distress/aggressive-class = episode.
  burst_barks: 5
  burst_window_seconds: 5
  burst_bad_emotion_min: 2
  # Signal 1b: sustained rate — barks/min above panic_bark_rate for
  # panic_duration_seconds with no self-termination. Distress/aggressive-class
  # barks count extra (weight below); demand/alarm/play count 1.0.
  panic_bark_rate: 10          # weighted barks per minute
  panic_duration_seconds: 180
  distress_weight: 1.5         # applies to groups listed in panic_weighted_groups
  panic_weighted_groups: [distress, aggressive]
  # Signal 2: escalation futility — N consecutive intervention cycles where
  # barking resumed within resume_window_seconds of the intervention ending.
  futility_cycles: 3
  futility_resume_window_seconds: 30
  # PANIC behavior
  play_calming_routine: true
  calming_routine_songs: 3     # play 3 random classical songs in a row
  # Exit via hysteresis: quiet (no passed barks) for calm_exit_seconds,
  # AND at least min_panic_duration_seconds since panic entry (no flapping).
  calm_exit_seconds: 300
  min_panic_duration_seconds: 300
  # After exiting panic, suppress interventions for this cooldown
  post_panic_cooldown_seconds: 900
  # More than this many episodes in one session -> subsequent panic alerts are
  # sent with severity 'high' and the session summary is flagged.
  max_episodes_before_high_severity: 2
  # Loud-noise context: a high-loudness non-bark sound (notbark veto) within
  # this window before an episode is reported as "after hearing loud noises"
  loud_noise_lookback_seconds: 120
  loud_noise_min_db: -15

# Camera settings for Silent Guardian mode
camera:
  mode: "fixed"                   # Stationary wide shot
  scan_on_bark: true              # Only scan when looking for dog after intervention
  scan_duration: 15.0              # Seconds to scan
  aruco_detection: true           # Enable ArUco for dog identification
